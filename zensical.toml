[project]
site_name = "Mój Homelab"
description = "Moje ściągawki i konfiguracje"

[theme]
name = "modern"
palette = "slate"
primary = "teal"

# Wymuszenie ciemnego motywu od razu po wejściu na stronę
[theme.options]
default_mode = "dark" 

# Włączenie rozszerzeń dla bloków kodu i specjalnych ramek
[markdown]
extensions = [
    "admonition",
    "pymdownx.superfences",
    "pymdownx.highlight"
]
